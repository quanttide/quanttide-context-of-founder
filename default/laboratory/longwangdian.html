<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>龙王店之夜 · 一场战斗的兵棋（1948.7.1—7.2）</title>
<style>
  :root{--ink:#232019;--paper:#efe7d6;--line:#b9ac91;--red:#b03028;--blue:#28496e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:13px;line-height:1.55}
  header{background:#3a3630;color:#f0e8d8;padding:9px 14px;display:flex;align-items:center;gap:12px}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
  header .when{color:#ffd98a;font-size:13px;font-variant-numeric:tabular-nums}

  .spacer{flex:1}

         border-radius:4px;padding:5px 10px;cursor:pointer}
  button:hover{background:#fff8ea}
  button.primary{background:#6b5b3e;color:#fff8ea;border-color:#6b5b3e;width:100%;padding:9px;font-size:13px}
  #btnHint{width:100%}
  main{display:flex;flex-direction:column;gap:10px;padding:12px;align-items:center}

  canvas{display:block}
  #bar{width:100%;max-width:860px}
  #todo{font-size:13px;min-height:20px}
  #last{font-size:11.5px;color:#7a7060;min-height:17px;margin-top:2px}
  .btns{display:flex;gap:8px;margin-top:8px}
  .btns .primary{flex:1}
  #modal{position:fixed;inset:0;background:rgba(30,26,20,.55);display:none;align-items:center;justify-content:center;z-index:50}
  #modal .box{background:var(--paper);border:1px solid #8a7f6c;border-radius:6px;max-width:760px;width:92%;
              max-height:86vh;overflow:auto;padding:14px 18px}
  #banner{position:fixed;left:50%;top:36%;transform:translateX(-50%);z-index:60;pointer-events:none;opacity:0;
          transition:opacity .3s;text-align:center}
  #banner .t{font-size:30px;font-weight:700;color:#fff8ea;text-shadow:0 3px 12px rgba(0,0,0,.65)}

<body>
<header>
  <h1>龙王店之夜</h1>
  <span class="dots" id="hDots">●○○○○</span>
  <span class="when" id="hWhen">20:00</span>
  <span class="spacer"></span>
  <button id="btnRules">？</button>
</header>

<main>
  <div id="mapwrap"><canvas id="map" width="820" height="600"></canvas></div>
  <div id="bar">
    <div id="todo"></div>
    <div id="last"></div>
    <div class="btns">
      <button id="btnHint">下一步</button>
      <button class="primary" id="btnEnd">结束红方回合 →</button>
    </div>
  </div>
</main>

<div id="banner"><div class="t"></div><div class="s"></div></div>
<div id="modal"><div class="box"><button style="float:right" id="btnClose">关闭</button><div id="mbody"></div></div></div>

<script>
'use strict';
/* ============ 龙王店之夜：单场战斗微想定 ============
   史料骨架：人民网《豫东战役：粟裕斗胆直陈战中原》、河南党史方志网《睢杞战役》
   规则一句话：D6 + 攻击力 − 防御力 ≥ 0 命中 1 点，≥ 3 命中 2 点。
   ================================================ */
const SIZE=52, COLS=8, ROWS=7, SQ3=Math.sqrt(3), OX=60, OY=56;
const ax=(c,r)=>({q:c-((r-(r&1))/2), r});
const ofs=(q,r)=>({col:q+((r-(r&1))/2), row:r});
const inMap=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function nb(c,r){const A=ax(c,r),o=[];for(const d of DIRS){const p=ofs(A.q+d[0],A.r+d[1]);if(inMap(p.col,p.row))o.push(p);}return o;}
function hd(a,b){const A=ax(a.col,a.row),B=ax(b.col,b.row),dq=A.q-B.q,dr=A.r-B.r;
  return Math.max(Math.abs(dq),Math.abs(dr),Math.abs(dq+dr));}
function hc(c,r){const A=ax(c,r);return{x:SIZE*SQ3*(A.q+A.r/2)+OX, y:SIZE*1.5*A.r+OY};}
function p2h(x,y){const px=x-OX,py=y-OY,q=(SQ3/3*px-py/3)/SIZE,r=(2/3*py)/SIZE;
  let X=q,Z=r,Y=-X-Z,rx=Math.round(X),ry=Math.round(Y),rz=Math.round(Z);
  const dx=Math.abs(rx-X),dy=Math.abs(ry-Y),dz=Math.abs(rz-Z);
  if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;
  return ofs(rx,rz);}
const K=(c,r)=>c+','+r;

/* 地形 */
const ter=[];for(let r=0;r<ROWS;r++){ter[r]=[];for(let c=0;c<COLS;c++)ter[r][c]={t:'plain',n:''};}
const PLACES=[{c:4,r:3,n:'龙王店',t:'fort'},{c:3,r:2,n:'杨拐',t:'village'},
  {c:5,r:2,n:'陈小楼',t:'village'},{c:1,r:5,n:'铁佛寺',t:'village'},{c:6,r:1,n:'帝丘店',t:'village'}];
PLACES.forEach(p=>{ter[p.r][p.c].t=p.t;ter[p.r][p.c].n=p.n;});
[[2,4],[3,4],[5,4],[2,2],[6,3]].forEach(([c,r])=>{ter[r][c].t='crop';});
const TDEF={plain:0,village:1,fort:6,crop:1};         // 龙王店土围子+外壕+鹿砦+密集火力
const TCOL={plain:'#e9e2cd',village:'#ddd6b8',fort:'#c8bd93',crop:'#ced9b4'};
const LW={col:4,row:3};
const SLOTS=[{c:4,r:4,n:'南',id:'r1'},{c:3,r:3,n:'西',id:'r4'},{c:5,r:3,n:'东',id:'r6'}];  // 史实三面攻城位

/* 算子 */
function U(o){o.max=o.st;o.def0=o.def;o.hit=0;o.bumpT=0;o.px=hc(o.col,o.row).x;o.py=hc(o.col,o.row).y;return o;}
const OOB=[
  U({id:'r1',side:'red',name:'1纵',atk:8,def:4,mov:3,st:4,col:4,row:5,note:'突击主力'}),
  U({id:'r4',side:'red',name:'4纵',atk:8,def:4,mov:3,st:4,col:2,row:3,note:'突击主力'}),
  U({id:'r6',side:'red',name:'6纵18师',atk:6,def:4,mov:3,st:3,col:5,row:4,note:'攻东门'}),
  U({id:'r11',side:'red',name:'11纵',atk:5,def:6,mov:3,st:3,col:6,row:4,note:'死死挡住帝丘店方向'}),
  U({id:'b75',side:'blue',name:'整75师',atk:3,def:5,mov:1,st:26,col:4,row:3,note:'土围子·外壕·鹿砦·小坦克；工事耐久 26 点'}),
  U({id:'b72',side:'blue',name:'整72师',atk:5,def:5,mov:0,st:2,col:1,row:5,off:true,note:'被围于铁佛寺，始终未能靠拢（史实）'}),
  U({id:'b25',side:'blue',name:'整25师',atk:6,def:5,mov:2,st:2,col:7,row:1,off:true,note:'第3回合起行动'})
];
const HOURS=['20:00','22:00','24:00','02:00','03:00'];
const FACTS=['20时 华野对龙王店发起总攻：1纵南门、4纵西门、6纵18师东门',
  '夜战激烈，守军凭土围子顽抗，日式小坦克上南城墙火力压制',
  '整25师抵帝丘店，距龙王店十里，炮声相闻却冲不破阻隔',
  '整72师在铁佛寺被中野11纵死死挡住，始终无法靠拢',
  '凌晨3时 华野突入城内，俘区寿年、沈澄年'];

let S;
function reset(){
  S={turn:1,phase:'red',sel:null,reach:null,log:[],ended:false,result:'',
     units:OOB.map(o=>({...o})),deadRed:0,penalty:false,b25In:false};
  // 第2回合整72师登场，第3回合整25师登场
  S.units.forEach(u=>{if(u.id==='b72')u.off=false;});
  log('20:00 总攻开始。三面合围龙王店即可发起攻击。');
}
function log(t){S.log.push(t);renderLog();}
const alive=u=>u.st>0&&!u.off;
const unitsAt=(c,r)=>S.units.filter(u=>alive(u)&&u.col===c&&u.row===r);
function defOf(u){
  const pen=u.max>6?Math.floor((u.max-u.st)/4):0;  // 只有工事会随打击崩塌，部队不因受损降防
  return Math.max(1,u.def+TDEF[ter[u.row][u.col].t]-pen);
}
const mm=id=>S.units.find(u=>u.id===id);

/* ===== 音效 ===== */
let AC=null; window.sndOn=true;
function snd(k){
  if(!window.sndOn)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,P={dice:[520,.09,'square',.05],hit:[170,.2,'square',.08],
      kill:[320,.55,'sine',.12],move:[200,.07,'triangle',.04],turn:[430,.14,'triangle',.05]}[k];
    if(!P)return;const o=AC.createOscillator(),g=AC.createGain();o.type=P[2];
    o.frequency.setValueAtTime(P[0],t);
    if(k==='kill')o.frequency.exponentialRampToValueAtTime(60,t+P[1]);
    g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[1]);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+P[1]+.02);}catch(e){}
}
function banner(t,s,ms){const el=document.getElementById('banner');
  el.querySelector('.t').textContent=t;el.querySelector('.s').textContent=s;
  el.classList.add('on');clearTimeout(banner._t);banner._t=setTimeout(()=>el.classList.remove('on'),ms||1800);}

/* ===== 绘制 ===== */
const cv=document.getElementById('map'),ctx=cv.getContext('2d');
function hexPath(x,y,s){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);
  const px=x+s*Math.cos(a),py=y+s*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
let T=0;
function drawSlots(){
  const puls=.45+.35*Math.sin(T*1.6);
  for(const sl of SLOTS){
    const p=hc(sl.c,sl.r);
    const occ=S.units.some(u=>alive(u)&&u.side==='red'&&u.col===sl.c&&u.row===sl.r);
    ctx.save();
    hexPath(p.x,p.y,SIZE-6);
    if(occ){ctx.fillStyle='rgba(47,107,48,.20)';ctx.fill();
      ctx.strokeStyle='#2f6b30';ctx.lineWidth=3.5;ctx.stroke();}
    else{ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(150,60,40,'+puls+')';ctx.lineWidth=2.4;
      ctx.stroke();ctx.setLineDash([]);}
    ctx.restore();
  }
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#f6f1e4';ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=hc(c,r),t=ter[r][c];hexPath(p.x,p.y,SIZE-2);
    ctx.fillStyle=TCOL[t.t];ctx.fill();ctx.strokeStyle='#b9ac91';ctx.lineWidth=1;ctx.stroke();
    if(t.t==='crop'){ctx.strokeStyle='#9aa87c';ctx.lineWidth=1.2;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(p.x-14,p.y+i*8-4);ctx.lineTo(p.x+14,p.y+i*8+6);ctx.stroke();}}
    if(t.n){ctx.fillStyle=t.t==='fort'?'#4a3018':'#4a4433';ctx.textAlign='center';
      ctx.font=(t.t==='fort'?'bold 14px':'bold 11px')+' sans-serif';ctx.fillText(t.n,p.x,p.y-24);}
    if(t.t==='fort'){ctx.save();ctx.strokeStyle='rgba(140,60,30,'+(0.55+0.35*Math.sin(T))+')';
      ctx.lineWidth=2.5;ctx.setLineDash([5,3]);hexPath(p.x,p.y,SIZE-6);ctx.stroke();ctx.restore();}
  }
  if(S.reach)for(const k in S.reach){const [c,r]=k.split(',').map(Number),p=hc(c,r);
    hexPath(p.x,p.y,SIZE-5);ctx.fillStyle='rgba(120,170,90,.3)';ctx.fill();}
  drawSlots();
  for(const u of S.units){
    if(!alive(u)&&!(u.deadT<1))continue;
    if(alive(u)){const c=hc(u.col,u.row);u.px+=(c.x-u.px)*.3;u.py+=(c.y-u.py)*.3;
      if(Math.abs(c.x-u.px)<.4&&Math.abs(c.y-u.py)<.4){u.px=c.x;u.py=c.y;}}
    const x=u.px+(u.bdx||0)*9*Math.max(0,u.bumpT||0),y=u.py+(u.bdy||0)*9*Math.max(0,u.bumpT||0);
    const w=96,h=22,al=(!alive(u))?Math.max(0,1-u.deadT):1;
    ctx.save();ctx.globalAlpha=al;
    if(!alive(u)){ctx.translate(x,y);ctx.scale(Math.max(.2,al),Math.max(.2,al));ctx.translate(-x,-y);}
    ctx.textAlign='center';
    rr(x-w/2,y-h/2,w,h,4);
    ctx.fillStyle=u.side==='red'?(u.st<u.max?'#c86b60':'#b03028'):(u.st<u.max?'#7c9cc0':'#28496e');ctx.fill();
    if(S.sel===u.id){ctx.strokeStyle='#ffcc33';ctx.lineWidth=2.5;rr(x-w/2,y-h/2,w,h,4);ctx.stroke();}
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';
    ctx.fillText(u.name,x,y+1);
    if(u.max>6){ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x-w/2+4,y+h/2-6,w-8,4);
      ctx.fillStyle='#ffd24a';ctx.fillRect(x-w/2+4,y+h/2-6,(w-8)*u.st/u.max,4);}
    else for(let i=0;i<u.max;i++){ctx.fillStyle=i<u.st?'#fff':'rgba(255,255,255,.28)';
      ctx.fillRect(x-w/2+4+i*8,y+h/2-5,6,3.5);}
    ctx.restore();
    if(u.hit>0){ctx.save();ctx.globalAlpha=Math.min(1,u.hit);ctx.strokeStyle='#ffb020';ctx.lineWidth=2;
      const R=8+18*(1-u.hit);for(let i=0;i<8;i++){const a=i*Math.PI/4;
        ctx.beginPath();ctx.moveTo(x+Math.cos(a)*R*.5,y+Math.sin(a)*R*.5);
        ctx.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R);ctx.stroke();}ctx.restore();}
  }
}
function frame(ts){
  for(const u of S.units){if(u.hit>0)u.hit-=.05;if(u.bumpT>0)u.bumpT-=.07;
    if(!alive(u)&&u.deadT<1)u.deadT+=.05;}
  T+=.12;draw();requestAnimationFrame(frame);
}

/* ===== 规则 ===== */
function canEnter(u,c,r){const t=ter[r][c];
  if(unitsAt(c,r).some(x=>x.side!==u.side))return false;
  return true;}
function enterCost(u,c,r){return ter[r][c].t==='crop'?2:1;}
function reach(u){
  const cost={},pq=[[0,u.col,u.row]];cost[K(u.col,u.row)]=0;
  while(pq.length){pq.sort((a,b)=>a[0]-b[0]);const cur=pq.shift();
    if(cur[0]>cost[K(cur[1],cur[2])])continue;
    for(const n of nb(cur[1],cur[2])){if(!canEnter(u,n.col,n.row))continue;
      const nc=cur[0]+enterCost(u,n.col,n.row);if(nc>u.mov)continue;
      if(cost[K(n.col,n.row)]===undefined||nc<cost[K(n.col,n.row)]){
        cost[K(n.col,n.row)]=nc;pq.push([nc,n.col,n.row]);}}}
  delete cost[K(u.col,u.row)];return cost;
}
const siege=()=>S.units.filter(u=>alive(u)&&u.side==='red'&&hd(u,LW)===1).length;
function attack(a,d,byAI){
  let mod=0,why=[];
  if(a.side==='red'&&!byAI){mod+=1;why.push('夜战+1');}
  const extra=S.units.filter(u=>alive(u)&&u.side===a.side&&u!==a&&hd(u,d)===1).length;
  if(extra){mod+=extra;why.push('夹击+'+extra);}
  if(S.penalty&&a.side==='red'){mod-=1;why.push('弹药告罄−1');}
  const roll=1+Math.floor(Math.random()*6);
  const diff=roll+a.atk+mod-defOf(d);
  const tgt=defOf(d);
  let dmg=diff>=3?2:diff>=0?1:0;
  let self=0;
  if(roll===1&&diff<0){self=1;}
  const dc=hc(d.col,d.row),ac=hc(a.col,a.row);
  const dx=dc.x-ac.x,dy=dc.y-ac.y,L=Math.hypot(dx,dy)||1;
  a.bdx=dx/L;a.bdy=dy/L;a.bumpT=1;
  if(dmg)d.hit=1;
  snd(dmg?'hit':'dice');
  log(`${a.name} → ${d.name}　${dmg?('命中 '+dmg+' 点'):(self?'失手反挫':'失手')}　D6=${roll}`);
  if(dmg)dmgTo(d,dmg,a);
  if(self)dmgTo(a,1,d);
  a.acted=true;
  render();
}
function dmgTo(u,n,src){
  u.st-=n;
  if(u.st>0){log(`${u.name} −${n}`);return;}
  u.st=0;u.deadT=0;snd('kill');
  if(u.side==='red'){S.deadRed++;log(`【战报】${u.name} 失去战斗力`);}
  else log(`【战报】${u.name} 被歼灭`);
  if(u.id==='b75'){banner('龙王店陷落！','凌晨 3 时突入城内，俘区寿年、沈澄年——与史实一致',3200);
    end('红方胜：攻克罗王店，俘区寿年兵团部');}
  else if(u.side==='red'&&S.deadRed>=2)end('蓝方胜：华野两部失去战斗力，攻城失利');
}
function end(t){
  S.ended=true;S.result=t;
  const win=t.indexOf('红方胜')>=0;
  log(win?'胜':'败');
  banner(win?'攻克':'天亮', win?'俘 区寿年':'援军云集，未克', 3000);
  snd(win?'kill':'alert');
  render();}

/* ===== 蓝方 AI（行为可预测，写在界面上） ===== */
function blueTurn(){
  S.phase='blue';render();
  const acts=[];
  for(const u of S.units.filter(x=>alive(x)&&x.side==='blue')){
    if(u.id==='b75'){
      const foes=S.units.filter(x=>alive(x)&&x.side==='red'&&hd(x,u)===1);
      if(foes.length){foes.sort((a,b)=>a.st-b.st);acts.push([u,foes[0]]);}
      continue;
    }
    // 援军：先朝龙王店推进，再攻击相邻红方
    const rg=reach(u);            // 按机动值可达范围，mov=0 则原地不动
    let best=null,bd=99;
    for(const k in rg){const [c,rr]=k.split(',').map(Number);
      const d=hd({col:c,row:rr},LW);if(d<bd){bd=d;best={col:c,row:rr};}}
    if(best&&bd<hd(u,LW)){u.col=best.col;u.row=best.row;snd('move');}
    const foes=S.units.filter(x=>alive(x)&&x.side==='red'&&hd(x,u)===1);
    if(foes.length){foes.sort((a,b)=>a.st-b.st);acts.push([u,foes[0]]);}
  }
  acts.forEach(([a,d])=>{if(alive(a)&&alive(d))attack(a,d,true);});
  nextTurn();
}
function nextTurn(){
  if(S.ended)return;
  if(S.turn>=5){end(S.units.find(u=>u.id==='b75').st>0?'蓝方胜：天亮援军云集，龙王店未克':'红方胜');return;}
  S.turn++;S.phase='red';S.sel=null;S.reach=null;
  S.units.forEach(u=>{u.acted=false;});
  if(S.turn===2){const b=mm('b72');if(b){b.off=false;log('整编第72师自铁佛寺向龙王店靠拢（被中野11纵阻隔）');}}
  if(S.turn===3){const b=mm('b25');if(b){b.off=false;S.b25In=true;banner('黄百韬兵团抵帝丘店！','距龙王店十里，炮声相闻——必须把它挡在外面',2400);
    log('整编第25师（黄百韬）自帝丘店方向压来，中野11纵正面阻击');}}
  const d6=1+Math.floor(Math.random()*6);
  S.penalty=(d6===1);
  log(`—— ${HOURS[S.turn-1]}${S.penalty?'　夜雨弹药告罄，红方攻击 −1':''}`);
  banner(`${HOURS[S.turn-1]}`, FACTS[S.turn-1], 2200);
  snd('turn');render();
}

/* ===== 交互 ===== */
cv.addEventListener('click',e=>{
  if(S.ended||S.phase!=='red')return;
  const rect=cv.getBoundingClientRect();
  const h=p2h(e.clientX-rect.left,e.clientY-rect.top);
  if(!inMap(h.col,h.row))return;
  const here=unitsAt(h.col,h.row),sel=S.units.find(u=>u.id===S.sel&&alive(u));
  const foe=here.find(u=>u.side==='blue');
  if(sel&&foe&&hd(sel,foe)===1){
    if(foe.id==='b75'&&siege()<3){banner('总攻条件不足','需要 3 个红方算子同时紧邻龙王店（南/西/东三面），当前 '+siege()+' 个',2000);return;}
    if(sel.acted){banner('本回合已攻击过','换另一个算子，或结束回合',1600);return;}
    attack(sel,foe);return;}
  const mine=here.find(u=>u.side==='red');
  if(mine){select(mine);return;}
  if(sel&&S.reach&&S.reach[K(h.col,h.row)]!==undefined){
    sel.col=h.col;sel.row=h.row;snd('move');
    log(`${sel.name} 机动至 ${ter[h.row][h.col].n||('('+h.col+','+h.row+')')}`);
    S.reach=reach(sel);render();return;}
  S.sel=null;S.reach=null;render();
});
function select(u){S.sel=u.id;S.reach=u.acted?null:reach(u);render();}
function odds(a,d){
  let mod=0;
  if(a.side==='red')mod+=1;
  mod+=S.units.filter(u=>alive(u)&&u.side===a.side&&u!==a&&hd(u,d)===1).length;
  if(S.penalty&&a.side==='red')mod-=1;
  const need=defOf(d)-a.atk-mod;
  const n1=Math.max(1,Math.min(7,need)),n2=Math.max(1,Math.min(7,need+3));
  return {n1,p1:Math.round(Math.max(0,7-n1)/6*100),n2,p2:Math.round(Math.max(0,7-n2)/6*100)};
}
function autoStep(){
  if(S.ended||S.phase!=='red')return;
  // 中野11纵：整25师进入战场后必须去顶住（史实：东抗黄兵团）
  const g=mm('r11'),b25=mm('b25');
  if(alive(g)&&alive(b25)&&!g.acted){
    if(hd(g,b25)===1){log('（引导）'+g.name+' 顶住 '+b25.name+'，不让它靠近龙王店');
      S.sel=g.id;attack(g,b25);return;}
    const r=reach(g);let best=null,bd=99;
    for(const k in r){const [c,rr]=k.split(',').map(Number);const d=hd({col:c,row:rr},b25);
      if(d<bd){bd=d;best={col:c,row:rr};}}
    if(best&&bd<hd(g,b25)){g.col=best.col;g.row=best.row;snd('move');
      log('（引导）'+g.name+' 移向帝丘店方向，准备阻击黄兵团');
      S.sel=g.id;S.reach=null;
      if(hd(g,b25)===1){attack(g,b25);return;}
      render();return;}
  }
  const empty=SLOTS.filter(sl=>!S.units.some(u=>alive(u)&&u.side==='red'&&u.col===sl.c&&u.row===sl.r));
  if(empty.length){
    let best=null;
    for(const u of S.units.filter(x=>alive(x)&&x.side==='red')){
      const r=reach(u);
      for(const sl of empty){ if(r[K(sl.c,sl.r)]!==undefined){
        const sc=(u.id===sl.id?0:1)+r[K(sl.c,sl.r)]*0.1;
        if(!best||sc<best.sc)best={u,sl,sc};}}
    }
    if(best){
      best.u.col=best.sl.c;best.u.row=best.sl.r;snd('move');
      log('（引导）'+best.u.name+' 进至龙王店'+best.sl.n+'面——三面就位才能总攻');
      S.sel=best.u.id;S.reach=null;
      if(siege()>=3){attack(best.u,mm('b75'));return;}   // 到位就顺势突击
      render();return;}
    let near=null;
    for(const u of S.units.filter(x=>alive(x)&&x.side==='red')){
      const r=reach(u);
      for(const k in r){const [c,rr]=k.split(',').map(Number);
        const d=Math.min(...empty.map(sl=>hd({col:c,row:rr},{col:sl.c,row:sl.r})));
        if(!near||d<near.d)near={u,c,r:rr,d};}}
    if(near&&near.d<Math.min(...empty.map(sl=>hd(near.u,{col:sl.c,row:sl.r})))){
      near.u.col=near.c;near.u.row=near.r;snd('move');
      log('（引导）'+near.u.name+' 向龙王店靠拢');S.sel=near.u.id;S.reach=null;render();return;}
    banner('本回合走不动了','点“结束红方回合”',1600);return;}
  const a=S.units.find(u=>alive(u)&&u.side==='red'&&hd(u,LW)===1&&!u.acted);
  if(a){log('（引导）三面已就位，'+a.name+' 突击');S.sel=a.id;attack(a,mm('b75'));return;}
  const idle=S.units.find(u=>alive(u)&&u.side==='red'&&!u.acted&&hd(u,LW)!==1);
  if(idle){
    const r=reach(idle);let best=null;
    for(const k in r){const [c,rr]=k.split(',').map(Number);
      if(hd({col:c,row:rr},LW)===1){best={col:c,row:rr};break;}}
    if(!best){let bd=99;for(const k in r){const [c,rr]=k.split(',').map(Number);
      const d=hd({col:c,row:rr},LW);if(d<bd){bd=d;best={col:c,row:rr};}}}
    if(best){idle.col=best.col;idle.row=best.row;snd('move');
      log('（引导）'+idle.name+' 贴到龙王店边，多一个方向夹击 +1');
      S.sel=idle.id;S.reach=null;
      if(hd(idle,LW)===1&&siege()>=3){attack(idle,mm('b75'));return;}
      render();return;}
  }
  banner('都已行动','点“结束红方回合”',1600);
}

/* ===== UI ===== */
const $=id=>document.getElementById(id);
function render(){
  $('hWhen').textContent=HOURS[S.turn-1];
  $('hDots').textContent=[...Array(5)].map((_,i)=>i<S.turn?'●':'○').join('');
  const sg=siege();
  const sel=S.units.find(u=>u.id===S.sel&&alive(u));
  const foe=sel?S.units.find(u=>alive(u)&&u.side==='blue'&&hd(u,sel)===1):null;
  let tip='';
  if(S.ended)tip=(S.result.indexOf('红方胜')>=0?'胜 · 俘区寿年':'败 · 天亮未克');
  else if(foe){const o=odds(sel,foe);tip=`命中 ${o.p1}%　重创 ${o.p2}%`;}
  else if(sg<3)tip=`还差 ${3-sg} 个进虚框`;
  else tip='点守军，攻击';
  if(!S.ended&&S.deadRed===1)tip+='　⚠ 再损失 1 个即失败';
  $('todo').textContent=tip;
  $('btnEnd').textContent = S.ended ? '再来' : S.phase==='red' ? '结束回合 →' : '蓝军行动中…';
  renderLog();draw();
}
function renderLog(){$('last').textContent=S.log[S.log.length-1]||'';}
$('btnEnd').onclick=()=>{if(S.ended){reset();render();select(mm('r1'));return;} if(S.phase!=='red')return; blueTurn();};
$('btnHint').onclick=autoStep;
$('btnClose').onclick=()=>$('modal').style.display='none';
$('btnRules').onclick=()=>{
  $('mbody').innerHTML=`<h2>龙王店之夜</h2>
  <p><b>五回合内，把 3 个红算子贴上龙王店，打光守军工事。</b></p>
  <p style="margin-top:10px">点算子 → 点绿格<b>移动</b>　点紧邻蓝军 → <b>攻击</b>　点底部按钮 → 蓝军行动</p>
  <p style="margin-top:10px"><b>D6 + 攻 − 防</b>　≥0 命中 1 点，≥3 命中 2 点，掷 1 且失手则自己反挫 1 点。夜战 +1，每多一面夹击 +1。</p>
  <p style="margin-top:10px">守军只反击；整25师第 3 回合从帝丘店压来，11纵必须顶住；整72师被围在铁佛寺动不了。</p>
  <p style="margin-top:10px">工事打光 → 胜；天亮未克或损失 2 个算子 → 败。</p>
  <button style="margin-top:12px" onclick="document.getElementById('modal').style.display='none'">开始</button>
  <button style="margin-left:6px" onclick="window.sndOn=!window.sndOn;this.textContent=window.sndOn?'♪ 开':'♪ 关'">♪ 开</button>
  <button style="margin-left:6px" onclick="reset();render();select(mm('r1'));document.getElementById('modal').style.display='none'">重开</button>`;
  $('modal').style.display='flex';
};

reset();render();requestAnimationFrame(frame);
select(mm('r1'));                                   // 开局选中 1 纵，绿格直接告诉你能往哪走
banner('20:00','3 个红算子贴上去，打光守军',2800);   // 开场一句，看完即消失
</script>
