<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>量潮门店中心 · 门店信息卡</title>
<style>
  /* 全局重置 */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Roboto, Arial, sans-serif;
    background: #f2f4f6;
    color: #1e1e1e;
    line-height: 1.55;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 卡片容器 */
  .card {
    max-width: 520px;
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  /* 头部 */
  .header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid #efefef;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .header .meta {
    font-size: 14px;
    color: #777;
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
  }
  .header .meta span {
    white-space: nowrap;
  }

  /* 分区 */
  .section {
    padding: 18px 20px;
    border-bottom: 1px solid #f0f0f0;
  }
  .section:last-of-type {
    border-bottom: none;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #aaa;
    margin-bottom: 12px;
  }

  /* 信息行 */
  .info-row {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    font-size: 14px;
    align-items: flex-start;
  }
  .info-row .label {
    flex: 0 0 80px;
    color: #888;
    font-weight: 400;
  }
  .info-row .value {
    flex: 1;
    color: #222;
    word-break: break-word;
  }
  .info-row .value .tag {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 4px;
    margin-right: 4px;
  }
  .info-row .value .tag.no {
    background: #fce4ec;
    color: #c62828;
  }
  .info-row .value .tag.maybe {
    background: #fff3e0;
    color: #e65100;
  }
  .info-row .value .pending {
    color: #bbb;
    font-style: italic;
  }

  /* 按钮组 */
  .actions {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 0;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    transition: opacity 0.2s;
    text-decoration: none;
  }
  .btn:active { opacity: 0.85; }
  .btn-primary {
    background: #1a1a1a;
    color: #fff;
  }
  .btn-secondary {
    background: #f0f0f0;
    color: #333;
  }

  /* 页脚 */
  .footer {
    text-align: center;
    padding: 16px 20px;
    background: #fafafa;
    font-size: 12px;
    color: #bbb;
    border-top: 1px solid #f0f0f0;
  }
  .footer a {
    color: #999;
    text-decoration: none;
  }
  .footer .update-time {
    margin-top: 4px;
    color: #ccc;
  }

  /* 复制反馈 */
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.78);
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 420px) {
    .header h1 { font-size: 19px; }
    .info-row { font-size: 13px; }
    .info-row .label { flex-basis: 68px; }
  }
</style>
</head>
<body>

<!-- 门店数据（修改这里即可生成新门店页面） -->
<script id="store-data" type="application/json">
{
  "name": "SOFA COFFEE",
  "branch": "悦达889店",
  "city": "滁州",
  "category": "咖啡馆",
  "address": "琅琊区育新东路158号 悦达889 9栋206-207（环城路19号，近南湖/老1912）",
  "hours": "10:30 – 次日01:00",
  "phone": "13855005031",
  "parking": "悦达889街区停车场（待核实具体入口）",
  "transit": "解放小学 / 南大院站步行约5分钟",
  "seatingIndoor": "有卡座、堂食区，含一架钢琴",
  "seatingOutdoor": "有店外休闲区域",
  "capacityNote": "可容纳约40-50人（估算）",
  "privateRoom": false,
  "bestFor": ["单人久坐", "双人约会", "朋友小聚", "轻办公"],
  "priceRange": "35–45 元",
  "menuTags": ["咖啡", "非咖啡饮品", "甜品"],
  "stayPolicy": "可长时间久坐，不赶人",
  "invoice": false,
  "bookingRequired": false,
  "deposit": false,
  "minSpend": false,
  "petAllowed": false,
  "powerOutlet": true,
  "wifi": true,
  "smoking": false,
  "notes": "小桌通常无需预订；大桌/活动建议电话沟通"
}
</script>

<!-- 页面主体 -->
<div class="card" id="app"></div>

<!-- 提示浮层 -->
<div class="toast" id="toast"></div>

<script>
(function() {
  // ---------- 读取数据 ----------
  const raw = document.getElementById('store-data').textContent;
  let data;
  try { data = JSON.parse(raw); } catch(e) {
    console.error('门店数据格式错误', e);
    return;
  }

  // ---------- 工具函数 ----------
  function tag(text, type) {
    // type: 'yes' | 'no' | 'maybe'
    const cls = type === 'yes' ? 'tag' : (type === 'no' ? 'tag no' : 'tag maybe');
    return `<span class="${cls}">${text}</span>`;
  }

  function boolTag(val, yesText='有', noText='无') {
    if (val === true) return tag(yesText, 'yes');
    if (val === false) return tag(noText, 'no');
    return `<span class="pending">待确认</span>`;
  }

  function listTags(arr) {
    if (!arr || arr.length === 0) return '<span class="pending">暂无信息</span>';
    return arr.map(item => `<span class="tag">${item}</span>`).join(' ');
  }

  // ---------- 构建 HTML ----------
  const app = document.getElementById('app');

  // 头部
  const headerHTML = `
    <div class="header">
      <h1>${data.name}</h1>
      <div class="meta">
        <span>${data.city} · ${data.branch || ''}</span>
        <span>${data.category}</span>
      </div>
    </div>
  `;

  // 到店信息
  const arrivalHTML = `
    <div class="section">
      <div class="section-title">到店信息</div>
      <div class="info-row"><div class="label">地址</div><div class="value">${data.address}</div></div>
      <div class="info-row"><div class="label">营业时间</div><div class="value">${data.hours}</div></div>
      <div class="info-row"><div class="label">电话</div><div class="value"><a href="tel:${data.phone}" style="color:#1a73e8;text-decoration:none;">${data.phone}</a></div></div>
      <div class="info-row"><div class="label">停车</div><div class="value">${data.parking || '<span class="pending">待确认</span>'}</div></div>
      <div class="info-row"><div class="label">公交</div><div class="value">${data.transit || '<span class="pending">待确认</span>'}</div></div>
    </div>
  `;

  // 空间与座位
  const spaceHTML = `
    <div class="section">
      <div class="section-title">空间与座位</div>
      <div class="info-row"><div class="label">店内</div><div class="value">${data.seatingIndoor || '<span class="pending">待确认</span>'}</div></div>
      <div class="info-row"><div class="label">户外</div><div class="value">${data.seatingOutdoor || '<span class="pending">待确认</span>'}</div></div>
      <div class="info-row"><div class="label">容量</div><div class="value">${data.capacityNote || '<span class="pending">待确认</span>'}</div></div>
      <div class="info-row"><div class="label">包间</div><div class="value">${boolTag(data.privateRoom, '有', '无')}</div></div>
      <div class="info-row"><div class="label">适合场景</div><div class="value">${listTags(data.bestFor)}</div></div>
    </div>
  `;

  // 消费信息
  const priceHTML = `
    <div class="section">
      <div class="section-title">消费信息</div>
      <div class="info-row"><div class="label">人均</div><div class="value">${data.priceRange || '<span class="pending">待确认</span>'}</div></div>
      <div class="info-row"><div class="label">品类</div><div class="value">${listTags(data.menuTags)}</div></div>
      <div class="info-row"><div class="label">停留</div><div class="value">${data.stayPolicy || '<span class="pending">待确认</span>'}</div></div>
      <div class="info-row"><div class="label">发票</div><div class="value">${boolTag(data.invoice, '可开具', '暂不支持')}</div></div>
    </div>
  `;

  // 规则与设施
  const ruleHTML = `
    <div class="section">
      <div class="section-title">规则与设施</div>
      <div class="info-row"><div class="label">预订</div><div class="value">${data.bookingRequired ? '建议提前预订' : '通常无需预订'}</div></div>
      <div class="info-row"><div class="label">低消</div><div class="value">${boolTag(data.minSpend, '有', '无')}</div></div>
      <div class="info-row"><div class="label">押金</div><div class="value">${boolTag(data.deposit, '有', '无')}</div></div>
      <div class="info-row"><div class="label">宠物</div><div class="value">${boolTag(data.petAllowed, '可带入', '不可带入')}</div></div>
      <div class="info-row"><div class="label">电源</div><div class="value">${boolTag(data.powerOutlet, '有插座', '无插座')}</div></div>
      <div class="info-row"><div class="label">WiFi</div><div class="value">${boolTag(data.wifi, '有', '无')}</div></div>
      <div class="info-row"><div class="label">吸烟</div><div class="value">${boolTag(data.smoking, '允许', '禁烟')}</div></div>
      ${data.notes ? `<div class="info-row"><div class="label">备注</div><div class="value">${data.notes}</div></div>` : ''}
    </div>
  `;

  // 按钮
  const actionsHTML = `
    <div class="actions">
      <a class="btn btn-primary" href="tel:${data.phone}">📞 电话咨询 / 订位</a>
      <button class="btn btn-secondary" id="copyAddrBtn">📍 复制地址</button>
    </div>
  `;

  // 页脚
  const footerHTML = `
    <div class="footer">
      由 <a href="#">量潮门店中心</a> 提供 · store.liangchao.com
      <div class="update-time">信息更新于 2026-10</div>
    </div>
  `;

  app.innerHTML = headerHTML + arrivalHTML + spaceHTML + priceHTML + ruleHTML + actionsHTML + footerHTML;

  // ---------- 复制地址功能 ----------
  const copyBtn = document.getElementById('copyAddrBtn');
  const toast = document.getElementById('toast');
  if (copyBtn && toast) {
    copyBtn.addEventListener('click', function() {
      navigator.clipboard.writeText(data.address).then(() => {
        toast.textContent = '地址已复制';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(() => {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = data.address;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        toast.textContent = '地址已复制';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    });
  }
})();
</script>

</body>
</html>
